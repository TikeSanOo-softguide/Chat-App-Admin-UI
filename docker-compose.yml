name: matrix

services:
  msisdn-identity:
    build: ./msisdn-service
    container_name: msisdn-identity
    restart: unless-stopped
    env_file:
      - ./msisdn-service/.env
    volumes:
      - ./msisdn-service:/app
    environment:
      - WATCHFILES_FORCE_POLLING=true
    expose:
      - "8091"

  synapse:
    image: matrixdotorg/synapse:v1.141.0
    container_name: synapse
    restart: unless-stopped
    command: ["run"]
    ports:
      - "8008:8008"
    volumes:
      - synapse_data:/data
      - ./homeserver.yaml:/data/homeserver.yaml
      - ./src/synapse/templates:/data/custom_templates
    depends_on:
      - postgres
      - msisdn-identity

  postgres:
    image: postgres:15
    container_name: synapse-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: synapse
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: synapsepass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  synapse-admin:
    build:
      context: .
    container_name: synapse-admin
    restart: unless-stopped
    ports:
      - "3030:5173"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    command: "yarn dev"
    depends_on:
      - synapse

volumes:
  synapse_data:
    external: true
    name: matrix_synapse_data
  postgres_data:
  node_modules: